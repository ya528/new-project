<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Multi-Device Responsive Viewport Illustration</title>
  <desc id="svgDesc">Vector diagram illustrating desktop, tablet, and smartphone viewports adapting fluidly.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="540" rx="24" fill="url(#bgGrad)"/>

  <!-- Desktop Frame -->
  <rect x="60" y="55" width="520" height="340" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="60" y="55" width="520" height="36" rx="16" fill="#f1f5f9"/>
  <circle cx="86" cy="73" r="6" fill="#94a3b8"/>
  <circle cx="106" cy="73" r="6" fill="#94a3b8"/>
  <circle cx="126" cy="73" r="6" fill="#94a3b8"/>
  <rect x="160" y="65" width="220" height="16" rx="8" fill="#e2e8f0"/>

  <!-- Desktop Grid Blocks -->
  <rect x="88" y="112" width="280" height="110" rx="10" fill="url(#accentGrad)"/>
  <rect x="384" y="112" width="168" height="110" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <rect x="88" y="240" width="144" height="125" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="248" y="240" width="144" height="125" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="408" y="240" width="144" height="125" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Tablet Frame -->
  <rect x="465" y="175" width="200" height="285" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <rect x="483" y="200" width="164" height="72" rx="8" fill="url(#accentGrad)"/>
  <rect x="483" y="286" width="76" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="571" y="286" width="76" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="483" y="370" width="164" height="65" rx="8" fill="#eff6ff" stroke="#93c5fd"/>

  <!-- Mobile Frame -->
  <rect x="625" y="245" width="120" height="240" rx="20" fill="#0f172a"/>
  <rect x="633" y="263" width="104" height="204" rx="12" fill="#ffffff"/>
  <rect x="643" y="275" width="84" height="54" rx="6" fill="url(#accentGrad)"/>
  <rect x="643" y="339" width="84" height="36" rx="6" fill="#f1f5f9"/>
  <rect x="643" y="383" width="84" height="36" rx="6" fill="#f1f5f9"/>
  <rect x="643" y="427" width="84" height="28" rx="6" fill="#dbeafe"/>
</svg>
